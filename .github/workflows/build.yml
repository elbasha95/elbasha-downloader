name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk git
        pip install buildozer cython kivy

    - name: Build APK
      run: |
        buildozer -f -v android debug 2>&1 | tail -50
        echo "Build completed, searching for APK..."

    - name: Find APK files
      run: |
        echo "Searching for APK files..."
        find /home/runner/work/elbasha-downloader -name "*.apk" -type f
        ls -la .buildozer/android/platform/build*/build/outputs/apk/debug/ 2>/dev/null || echo "Directory structure not found"

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: elbasha-apk
        path: |
          .buildozer/android/platform/build*/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Create Release with APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          .buildozer/android/platform/build*/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
